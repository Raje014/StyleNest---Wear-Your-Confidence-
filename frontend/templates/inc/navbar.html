{% load static %}

<!DOCTYPE html>
<html lang="en">
  <nav class="navbar navbar-expand-lg navbar-light fixed-top" style="background-color: #e3f2fd;">
    <div class="container-fluid">
      <div class="ps-3">
          <img src="{% static 'assets/shopping-cart.png' %}" alt="logo" width="30" height="30">
      </div>
      <a class="navbar-brand" href="{% url 'dashboard' %}">StyleNest</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarScroll" aria-controls="navbarScroll" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-between" id="navbarScroll">
        <ul class="navbar-nav mx-auto my-2 my-lg-0 navbar-nav-scroll" style="--bs-scroll-height: 100px;">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'dashboard' %}"><i class="fa fa-home"></i>Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'about' %}"><i class="fa fa-info-circle"></i>About</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'collections' %}"><i class="fa fa-cubes"></i>Collections</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'cart' %}"><i class="fa fa-shopping-cart"></i>Cart</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="{% url 'fav_view_page' %}"><i class="fa fa-heart"></i>Favourite</a>
          </li>
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle active" href="#" id="navbarScrollingDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="fa fa-shopping-bag"></i>shop
            </a>
            <ul class="dropdown-menu" aria-labelledby="navbarScrollingDropdown">
              <li><a class="dropdown-item" href="#">women</a></li>
              <li><a class="dropdown-item" href="#">men</a></li>
              <!-- <li><hr class="dropdown-divider"></li> -->
              <li><a class="dropdown-item" href="#">kids</a></li>
            </ul>
          </li>
        </ul>
        <form class="d-flex pe-3">
          <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
          {% if request.user.is_authenticated %}
            <a href="{% url 'logout' %}" class="btn btn-outline-success">Logout</a>
            <i class="fa fa-user" style="font-size: 24px;padding-top:7px;padding-left: 9px;"></i>
          {% else %}
            <a href="{% url 'login' %}" class="btn btn-outline-success">Login</a>
          {% endif %}
        </form>
      </div>
    </div>
  </nav>
</html>
