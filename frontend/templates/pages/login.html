{% extends 'layouts/main_template.html'%}

{% block title %}
    Register
{% endblock title %}

{% block content %}

    <div class="container" style="margin-top: 30px;min-height: 600px;">
        <div class="row">
            <div class="col-12">
                <div class="mb-3"><h1>User Login</h1></div>
                <hr style="border-color: #b8bfc2;">
                {% include 'inc/message.html' %}
            </div>
        </div>
        <section class="py-4">
            <div class="container">
                <div class="row">
                    <div class="col-6">
                        <!-- form creation -->
                        <form method="POST" action="">
                            {% csrf_token %}
                            <div class="mb-4">
                                <label for="" class="form-label">Username</label>
                                <input type="text" name="username" id="username" class="form-control" placeholder="Enter Username">
                            </div>
                            <div class="mb-4">
                                <label for="" class="form-label">Password</label>
                                <input type="password" name="password" id="password" class="form-control" placeholder="Enter Password">
                            </div>
                            <button type="submit" class="btn btn-primary">Login</button>
                        </form>
                        <p class="my-2">Don't have an account? <a href="{% url 'register' %}">Register here</a></p>
                    </div>
                </div>
            </div>
        </section>
    </div>

{% endblock content%}
