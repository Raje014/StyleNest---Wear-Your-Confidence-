{% extends 'layouts/main_template.html' %}

{% block title %}
    Checkout
{% endblock title %}

{% block content %}

<section class="bg-light py-4">
    <div class="container">

        <h4 class="mb-3">Checkout</h4>
        <hr>

        <form method="POST">
            {% csrf_token %}

            <!-- CUSTOMER DETAILS -->

            <div class="card p-4 mb-4">

                <h5 class="mb-3">Customer Details</h5>

                <div class="mb-3">
                    <label class="form-label">Username</label>

                    <input type="text"
                           name="customer_name"
                           class="form-control"
                           value="{{ user.username }}"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>

                    <input type="tel"
                           name="mobile"
                           class="form-control"
                           placeholder="Enter mobile number"
                           maxlength="15"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Address</label>

                    <textarea name="address"
                              class="form-control"
                              rows="3"
                              placeholder="Enter your complete address"
                              required></textarea>
                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label class="form-label">City</label>

                        <input type="text"
                               name="city"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">State</label>

                        <input type="text"
                               name="state"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-4 mb-3">
                        <label class="form-label">Pincode</label>

                        <input type="text"
                               name="pincode"
                               class="form-control"
                               maxlength="10"
                               required>
                    </div>

                </div>

            </div>


            <!-- PAYMENT METHOD -->

            <div class="card p-4 mb-4">

                <h5 class="mb-3">Payment Method</h5>

                <div class="form-check mb-2">

                    <input class="form-check-input"
                           type="radio"
                           name="payment_method"
                           value="RAZORPAY"
                           id="razorpay"
                           required>

                    <label class="form-check-label" for="razorpay">
                        UPI / Razorpay
                    </label>

                </div>

                <div class="form-check">

                    <input class="form-check-input"
                           type="radio"
                           name="payment_method"
                           value="COD"
                           id="cod">

                    <label class="form-check-label" for="cod">
                        Cash on Delivery
                    </label>

                </div>

            </div>


            <!-- CONTINUE -->

            <div class="text-end">

                <button type="submit"
                        class="btn btn-primary btn-lg">
                    Continue to Review
                </button>

            </div>

        </form>

    </div>
</section>

{% endblock content %}
